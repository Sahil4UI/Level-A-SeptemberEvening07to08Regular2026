<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            background-color: orange;
            background-color: rgb(25, 213, 216);
            background-color: #0000ff;
            height: 450px;
            width : 350px;
            background-image: linear-gradient(45deg,red,green,blue);
            background-image: repeating-linear-gradient(red,green,blue 50%);

            background-image: radial-gradient(red,green,blue);
            background-image: repeating-radial-gradient(red,green,blue 10%);
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8pwJqOCee4Px87YwqXeP0wFIeNpBdYOeKuzmt3Ip-3g&s=10");
            background-size: contain;
            /* height wise */
            background-repeat: no-repeat;
            background-size: cover;
            /* width wise */
            background-size: 100% 100%;
        }
    </style>
</head>
<body>
    <div class="a"></div>
</body>
</html>
