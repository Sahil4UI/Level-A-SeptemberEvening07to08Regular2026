<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        ul li{
            display:inline;

        }
        a{
            /* inline tag pe sahi se padding margin nhi ati */
            display:inline-block;
            margin:40px;
            padding:20px;
            background-color:blue;
        }
    </style>
</head>
<body>
    <!-- inline tag - width autoXauto -->
    <a>Click Me</a>
    <a>Click Me</a>
    <a>Click Me</a>
    <a>Click Me</a>
    <a>Click Me</a>
    <a>Click Me</a>

    <!-- block tag - width 100% -->
    <ul>
        <li>list item 1</li>
        <li>list item 2</li>
        <li>list item 3</li>
        <li>list item 4</li>
        <li>list item 5</li>
    </ul>
</body>
</html>
