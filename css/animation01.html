<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 20%;
            animation-name: jerry;
            animation-timing-function: linear;
            animation-duration: 2s;
            animation-iteration-count: infinite;

        }

        @keyframes jerry{
            0%{
                transform: translate(0,0);
            }
            25%{
                transform: translate(500px,0);
            }
            50%{
                transform: translate(500px,400px);
            }
            75%{
                transform: translate(0,500px);
            }
            100%{
                transform: translate(0,0);
            }

        }
    </style>
</head>
<body>
    <div class="box">
        <img src="https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUybXhxZzU3dDNtdnJ1Y2ppOThmOHYwb2t5djIzYzVoM2Fpb2gzYnFtYiZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/fstV57yumJ3dMUaYPr/200w.gif" alt="">
    </div>
</body>
</html>
